name: release

# Builds a 64-bit self-contained package and attaches it to a GitHub Release
# whenever a version tag (v1.2.3) is pushed. Create a tag with:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch mpv engine (libmpv-2.dll, 64-bit)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-mpv.ps1

      - name: Publish (self-contained single-file, win-x64)
        shell: pwsh
        run: |
          $publish = "dist\win-x64\publish"
          dotnet publish src\MyPlayer\MyPlayer.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -o $publish
          Copy-Item native\win-x64\libmpv-2.dll -Destination $publish -Force

      - name: Zip the package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          Compress-Archive -Path dist\win-x64\publish\* -DestinationPath "MPLC-$ver-win-x64.zip" -Force

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: MPLC ${{ github.ref_name }}
          generate_release_notes: true
          files: MPLC-${{ github.ref_name }}-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
