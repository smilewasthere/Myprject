name: release

# Builds a 64-bit self-contained package, compiles a real Windows installer
# (install / uninstall via Add-Remove Programs), and attaches both to a
# GitHub Release when a version tag (v1.2.3) is pushed. Create a tag with:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: ver
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch mpv engine (libmpv-2.dll, 64-bit)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-mpv.ps1

      # Self-contained FOLDER publish (not single-file): the app loads
      # libmpv-2.dll via P/Invoke, which is unreliable from a single-file
      # bundle. The installer compresses the folder into one exe anyway.
      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          $publish = "dist\win-x64\publish"
          dotnet publish src\MyPlayer\MyPlayer.csproj -c Release -r win-x64 `
            --self-contained true -o $publish
          Copy-Item native\win-x64\libmpv-2.dll -Destination $publish -Force

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\win-x64\publish\* `
               -DestinationPath "MPLC-${{ steps.ver.outputs.VERSION }}-win-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer (install/uninstall)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DSourceDir=$env:GITHUB_WORKSPACE" `
                   "/DPublishDir=$env:GITHUB_WORKSPACE\dist\win-x64\publish" `
                   "/DAppVersion=$env:APP_VERSION" `
                   "installer\mplc.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed: $LASTEXITCODE" }

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: MPLC ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/MPLC-Setup-${{ steps.ver.outputs.VERSION }}.exe
            MPLC-${{ steps.ver.outputs.VERSION }}-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

