# MyPlayer default mpv.conf
# Exactly the same format as mpv itself — edit freely, changes apply on next launch.
# Location: %APPDATA%\MyPlayer\mpv.conf

# ---- Video quality (quality-first defaults) ----
vo=gpu-next
hwdec=auto-safe
scale=ewa_lanczossharp
cscale=ewa_lanczossoft
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes

# ---- HDR ----
# Pass through HDR metadata to a capable display; tone-map otherwise.
target-colorspace-hint=yes
hdr-compute-peak=yes

# ---- OSD, VLC-style: big centered messages, progress bar at the bottom ----
osd-align-x=center
osd-align-y=center
osd-font-size=42
osd-duration=1500
osd-bar-align-y=1
osd-bar-w=85
osd-bar-h=2

# ---- Audio ----
volume=100
volume-max=300

# ---- Subtitles / external files ----
sub-auto=fuzzy
audio-file-auto=fuzzy

# ---- Behavior ----
keep-open=yes
save-position-on-quit=no
