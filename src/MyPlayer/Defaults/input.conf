# MyPlayer default input.conf — VLC-style keys
# Exactly the same format as mpv itself — rebind anything here and it applies
# on next launch. Keys NOT listed here fall through to MyPlayer's own handling
# (fullscreen toggle, etc.).
# Location: %APPDATA%\MyPlayer\input.conf

# ---- Transport ----
SPACE cycle pause
p cycle pause
RIGHT seek 5
LEFT seek -5
UP seek 60
DOWN seek -60
ENTER playlist-next force
< playlist-prev force
> playlist-next force

# ---- Audio, VLC-style ----
m cycle mute
Ctrl+UP add volume 5
Ctrl+DOWN add volume -5

# ---- Mouse ----
# Wheel over the video = volume (mirrors VLC). mpv sees the mouse directly
# on the video area, so these bindings work there; the rest of the window
# is native-WPF and handled by MyPlayer.
WHEEL_UP add volume 5
WHEEL_DOWN add volume -5
MOUSE_BTN0_DBL ignore   # double-click is handled by MyPlayer (fullscreen)
